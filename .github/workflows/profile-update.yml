name: Atualizar painel do perfil

on:
  schedule:
    # Uma vez por semana: suficiente para um perfil pessoal e sem ruído no histórico.
    - cron: "17 3 * * 0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/profile_update.py"
      - ".github/workflows/profile-update.yml"

concurrency:
  group: profile-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cartões com a API oficial do GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/profile_update.py

      - name: Publicar somente se houver mudança real
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-summary.svg assets/github-languages.svg assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "Nenhuma métrica mudou; nenhum commit será criado."
            exit 0
          fi
          git commit -m "chore(bot): atualiza painel do GitHub [skip ci]"
          git push
